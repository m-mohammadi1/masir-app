name: mohammad
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  easy_helper:
    path: packages/easy_helper
  dio: ^5.9.0
  bloc: ^9.0.1
  flutter_bloc: ^9.1.1
  injectable: ^2.5.2
  get_it: ^8.2.0
  freezed: ^3.2.3
  freezed_annotation: ^3.1.0
  flutter_svg: ^2.2.1
  dartz: ^0.10.1
  hive_ce: ^2.14.0
  hive_ce_flutter: ^2.3.2
  app_links: ^6.4.1
  google_fonts: ^6.3.2
  cupertino_icons: ^1.0.8
  flutter_localization: ^0.3.3
  bottom_picker: ^4.1.1
  go_router: ^14.8.1
  persian_datetime_picker: ^3.2.0
  file_picker: ^10.3.3
  otp_text_field_v2: ^1.0.3
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  intl: ^0.20.2
  geolocator: ^14.0.2
  firebase_core: ^3.11.0
  firebase_messaging: ^15.2.2
  flutter_local_notifications: ^20.1.0
  flutter_html: ^3.0.0
  audioplayers: ^6.5.0
  video_player: ^2.13.0
  confetti: ^0.8.0
  toastification: ^3.0.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.9.0
  hive_ce_generator: ^1.9.5
  injectable_generator: ^2.9.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  freezed: ^3.2.3

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/png/
    - assets/svg/
    - assets/fonts/
  #   - images/a_dot_ham.jpeg


  fonts:
    - family: Pinar
      fonts:
        - asset: assets/fonts/Pinar/Pinar-FD-Regular.ttf
          style: italic
    - family: Pinar-Bold
      fonts:
        - asset: assets/fonts/Pinar/Pinar-FD-Bold.ttf
        - asset: assets/fonts/Pinar/Pinar-FD-ExtraBold.ttf
        - asset: assets/fonts/Pinar/Pinar-FD-SemiBold.ttf
          weight: 700
    - family: Pinar-Medium
      fonts:
        - asset: assets/fonts/Pinar/Pinar-FD-Medium.ttf
          weight: 500
    - family: Pinar-Regular
      fonts:
        - asset: assets/fonts/Pinar/Pinar-FD-Regular.ttf
          weight: 400
    - family: Masir
      fonts:
        - asset: assets/fonts/IRANSansX/IRANSansXFaNum-RegularD4.ttf
          weight: 400
        - asset: assets/fonts/IRANSansX/IRANSansXFaNum-MediumD4.ttf
          weight: 500
        - asset: assets/fonts/IRANSansX/IRANSansXFaNum-DemiBoldD4.ttf
          weight: 600
        - asset: assets/fonts/IRANSansX/IRANSansXFaNum-BoldD4.ttf
          weight: 700
        - asset: assets/fonts/IRANSansX/IRANSansXFaNum-ExtraBoldD4.ttf
          weight: 800
    - family: IRANSans
      fonts:
        - asset: assets/fonts/IRANSansX/IRANSansXFaNum-MediumD4.ttf
          weight: 400
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
